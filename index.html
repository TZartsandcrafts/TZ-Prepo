<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="有谱">
<meta name="theme-color" content="#FF6B1A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>有谱 Prepo</title>
<style>
:root{--o:#FF6B1A;--y:#FFB300;--r:#E5262B;--bg:#F4F5F7;--card:#fff;--tx:#1F2328;--mu:#6B7280}
@media(prefers-color-scheme:dark){:root{--bg:#15171B;--card:#22252B;--tx:#F3F4F6;--mu:#9CA3AF}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.6 -apple-system,"PingFang SC",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 14px;background:linear-gradient(90deg,var(--o),var(--y));color:#fff;font-size:21px;font-weight:700}
.bar span{flex:1}.bar small.ver{font-size:12px;font-weight:400;margin-left:6px;opacity:.9}.bar button{background:none;border:0;color:#fff;font-size:22px;padding:6px 10px}
.pg{padding:14px 16px 60px}
h1{font-size:27px;margin:.2em 0}h2{font-size:21px;color:var(--o);margin:1.1em 0 .3em}
.m{color:var(--mu)}ul,ol{padding-left:1.3em}li b{float:right;font-weight:600;color:var(--mu)}li{clear:both}
.btn{display:block;width:100%;min-height:56px;margin:12px 0;border:0;border-radius:14px;background:var(--o);color:#fff;font-size:20px;font-weight:700}
.btn.y{background:var(--y);color:#1F2328}.btn.g{background:var(--card);color:var(--o);border:2px solid var(--o)}.btn.r{background:var(--r)}
.row{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:0;border-left:6px solid var(--y);border-radius:12px;padding:12px 14px;margin:10px 0;font:inherit}
.row small{display:block;color:var(--mu);font-size:15px}.ok{color:var(--r);font-weight:700}
input,textarea{width:100%;font:inherit;padding:12px;border:2px solid var(--y);border-radius:12px;background:var(--card);color:var(--tx)}
textarea{min-height:140px}
#dr{position:fixed;inset:0;z-index:9;display:none;background:rgba(0,0,0,.4);overscroll-behavior:contain}html:has(#dr.on),body:has(#dr.on){overflow:hidden}#dr.on{display:block}
#dr div{width:78%;max-width:340px;height:100%;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 14px;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pro{height:8px;border-radius:4px;background:#E5E7EB;margin:6px 0 14px}.pro i{display:block;height:100%;border-radius:4px;background:var(--r)}
.big{font-size:34px;font-weight:800;color:var(--r)}
.stk{position:sticky;top:0;z-index:5;background:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.12)}.stk .bar{position:static}
.top{padding:10px 16px}.top input{display:block}.hp{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid rgba(128,128,128,.3);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border:0;background:none;color:var(--tx);font:inherit;font-size:15px;font-weight:700}
.nav svg{width:34px;height:34px;stroke:var(--o);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hn .mig{bottom:calc(96px + env(safe-area-inset-bottom))}
.cur{margin:0 0 6px;border:2px solid var(--o);border-radius:12px;padding:10px 14px;background:var(--card);font-size:18px;line-height:1.5}.cur b{color:var(--o)}.cur span{color:var(--mu);font-size:15px}
.ing{list-style:none;padding:0;margin:.3em 0;border-top:1px solid rgba(128,128,128,.3)}
.ing li{display:flex;align-items:baseline;gap:6px;padding:10px 0;border-bottom:1px solid rgba(128,128,128,.3)}
.ing li i{flex:1;min-width:16px;height:0;border-bottom:2px dotted var(--mu);opacity:.6}
.ing li b{float:none;max-width:55%;text-align:right;flex:none}
.mig{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:8;display:none;padding:12px 14px;border-radius:12px;background:var(--card);color:var(--tx);border:2px solid var(--o);font-size:16px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.25)}
</style></head><body>
<div id="app"></div><div id="dr"><div id="drc"></div></div><div id=mig class=mig onclick="this.style.display='none'"></div>
<script>
const P='prepo:',DB='prepo_kv',VER='0.1.13';
const WK=()=>localStorage.getItem(P+'workerUrl')||'';
/* 存储层：只读写自己的 prepo_kv；以后要加 Firebase 同步，只需替换这两个函数 */
const idb=()=>new Promise((ok,no)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const kvGet=async k=>{const d=await idb();return new Promise(ok=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>ok(r.result)})};
const kvSet=async(k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})};
let S={recipes:[],cats:[]};const save=()=>kvSet('data',S);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const txt=v=>Array.isArray(v)?v.join('；'):(v||'');
const norm=s=>(s||'').toLowerCase().replace(/[\s\p{P}\p{S}]/gu,'');
/* 导航：从哪来回哪去，并还原滚动位置 */
let stack=[],cur={v:'home'},V={},F={cat:'',made:'',q:'',sort:'new'},ASK='',FILES=[],SG=null,DIRTY=false,WARN=false;
const go=(v,a)=>{cur.y=scrollY;stack.push(cur);cur={v,a};draw()};
const back=()=>{if(!stack.length)return;if(cur.v==='edit'&&DIRTY&&!WARN){WARN=true;const e=$('#st');if(e)e.textContent='有未保存的修改，再返回一次将放弃修改';return}DIRTY=false;WARN=false;cur=stack.pop();draw(cur.y)};
function draw(y){V={};document.body.classList.toggle('hn',cur.v==='home');const f=VIEWS[cur.v];$('#app').innerHTML=f(cur.a);window.scrollTo(0,y||0);$('#dr').classList.remove('on')}
const hdr=(t,l='‹',r='')=>`<div class="bar"><button onclick="back()">${l}</button><span>${t}</span>${r}</div>`;
const body=r=>`<h1>${esc(r.name)}</h1><p class=m>${[r.author&&'作者：'+r.author,r.source&&'来源：'+r.source,r.rating&&'评分：'+r.rating].filter(Boolean).map(esc).join('<br>')}</p><h2>材料</h2><ul class=ing>${(r.ingredients||[]).map(i=>`<li><span>${esc(i.name||i)}</span>${i.amount?`<i></i><b>${esc(i.amount)}</b>`:''}</li>`).join('')}</ul><h2>步骤</h2><ol>${(r.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${r.notes?`<h2>注意事项</h2><p>${esc(txt(r.notes))}</p>`:''}`;
const SORTN={new:'按抓取时间·新到旧',old:'按抓取时间·旧到新',name:'按名称'};
const PAL=['#FF6B1A','#E5262B','#FFB300','#D6336C','#7048E8','#1C7ED6','#0CA678','#74B816'];
const catColor=c=>{const i=S.cats.indexOf(c);return i<0?'#9CA3AF':PAL[i%PAL.length]};
const rowOf=r=>`<button class=row style="border-left-color:${catColor(r.category)}" onclick="go('detail','${r.id}')">${esc(r.name)} ${r.made?'<span class=ok>✓已做过</span>':''}<small>${esc([r.category,r.author].filter(Boolean).join(' · '))}</small></button>`;
const filt=()=>{
 const L=S.recipes.filter(r=>(!F.cat||r.category===F.cat)&&(!F.made||(F.made==='1')===!!r.made)&&(!F.q||norm(r.name+(r.ingredients||[]).map(i=>i.name)).includes(norm(F.q))));
 const SO={new:(a,b)=>(b.created||0)-(a.created||0),old:(a,b)=>(a.created||0)-(b.created||0),name:(a,b)=>String(a.name).localeCompare(String(b.name),'zh')};L.sort(SO[F.sort]||SO.new);return L};
const NAV=`<div class=nav><button onclick="go('ask')"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>找食谱</button><button onclick="FILES=[];go('add')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>加食谱</button></div>`;
const VIEWS={
home(){
 const L=filt();
 V.swipe=(d,x)=>{if(d==='R'&&x<60)openDr()};
 return '<div class=stk>'+hdr('有谱 Prepo<small class=ver>v'+VER+'</small>','☰','<button onclick="go(\'set\')">⚙</button>').replace('back()','openDr()')+`<div class=top><input placeholder="搜索名称或材料" value="${esc(F.q)}" onchange="F.q=this.value;draw()"></div></div><div class="pg hp">${L.map(rowOf).join('')||`<p class=m>${S.recipes.length?'没有符合条件的食谱。':'还没有食谱，点下面的“加食谱”添加一个吧。'}</p>`}</div>${NAV}`},
add(id){
 const r=id?S.recipes.find(x=>x.id===id):null;
 return hdr(r?'继续添加截图':'添加食谱')+`<div class=pg>${r?`<p class=m>给「${esc(r.name)}」补充内容：选择接下来的截图（最多 50 张，每 10 张一批），AI 会把新内容合并进这个食谱，自动去重并接在正确位置。</p>`:`<p class=m>选择食谱截图（最多 50 张）。10 张以内：AI 自己判断是一个还是多个食谱；超过 10 张：按同一个食谱处理，每 10 张一批依次提取并合并。AI 会提取名称、作者、来源、材料、步骤、注意事项和评分，自动分类并查重。</p>`}<input type=file accept="image/*" multiple onchange="FILES=[...this.files].slice(0,50);$('#fc').textContent=fcText()"><p id=fc class=m>${fcText()}</p><button class=btn id=go onclick="extract('${id||''}')">开始提取并保存</button><p class=m>截图只用来提取，用完不会保存，只保存提取出的文字。</p><p id=st class=m></p></div>`},
result(a){
 const n=a.added.map(id=>S.recipes.find(r=>r.id===id)).filter(Boolean),d=a.dups.map(id=>S.recipes.find(r=>r.id===id)).filter(Boolean);
 return hdr('提取结果')+`<div class=pg><h2>新增 ${n.length} 个</h2>${n.map(rowOf).join('')||'<p class=m>无</p>'}<h2>重复 ${d.length} 个，未重复添加</h2>${d.length?'<p class=m>以下食谱已有记录，已提醒你；它们会在建议时优先考虑。</p>':''}${d.map(rowOf).join('')}<button class=btn onclick="stack=[];cur={v:\'home\'};draw()">回到食谱库</button></div>`},
detail(id){
 const r=S.recipes.find(x=>x.id===id);if(!r)return hdr('食谱')+'<div class=pg>食谱不存在</div>';
 return hdr('食谱')+`<div class=pg>${body(r)}<button class="btn y" onclick="FILES=[];go('add','${id}')">继续添加截图 ›</button>
 <button class="btn g" onclick="go('edit','${id}')">编辑食谱文字 ›</button>
 <button class="btn g" onclick="go('pick','${id}')">分类：${esc(r.category||'未分类')} ›</button>
 <button class="btn ${r.made?'g':'y'}" onclick="mark('${id}')">${r.made?'✓ 已做过（'+esc(r.made)+'）点此取消':'标记为已做过'}</button>
 ${r.bak?`<button class="btn g" onclick="if(this.dataset.s){undoMerge('${id}')}else{this.dataset.s=1;this.textContent='再点一次确认撤销'}">撤销上一次续传（恢复到续传前）</button>`:''}
 <button class="btn r" id=dl onclick="if(this.dataset.s){S.recipes=S.recipes.filter(x=>x.id!=='${id}');save();back()}else{this.dataset.s=1;this.textContent='再点一次确认删除'}">删除这个食谱</button></div>`},
pick(id){
 return hdr('选择分类')+`<div class=pg>${S.cats.map(c=>`<button class=row style="border-left-color:${catColor(c)}" onclick="setCat('${id}',this.dataset.c)" data-c="${esc(c)}">${esc(c)}</button>`).join('')}<input id=nc placeholder="新分类名称"><button class=btn onclick="setCat('${id}',$('#nc').value.trim())">使用新分类</button></div>`},
ask(){
 return hdr('求建议')+`<div class=pg><p class=m>写下你想做什么、人数、口味、时间，以及现有的材料和器具。</p><textarea id=need oninput="ASK=this.value" placeholder="例：晚上两个人吃，30分钟内，家里有鸡腿、土豆、洋葱，烤箱可用">${esc(ASK)}</textarea><button class=btn id=go onclick="suggest()">获取建议</button><p id=st class=m></p></div>`},
sug(){
 const L=SG.list,i=SG.i,s=L[i],r=s.r;
 V.swipe=d=>{if(d==='L'&&i<L.length-1){SG.i++;draw()}else if(d==='R'){if(i>0){SG.i--;draw()}else back()}};
 return hdr(`建议 ${i+1} / ${L.length}`)+`<div class=pg>${i===0&&SG.madeN?`<p class=m>另有 ${SG.madeN} 个匹配但已做过的食谱，已排在后面。</p>`:''}<div class=big>${s.match}% 匹配</div><div class=pro><i style="width:${s.match}%"></i></div>${r.made?`<p class=ok>你已做过这个（${esc(r.made)}）</p>`:''}${(r.saves||1)>1?'<p class=m>这个食谱你重复收藏过，所以优先考虑。</p>':''}<h2>推荐理由</h2><p>${esc(s.reason)}</p>${body(r)}<button class="btn y" onclick="V.swipe('L')">下一个 ›（也可左划）</button><button class="btn g" onclick="V.swipe('R')">‹ 上一个（也可右划）</button></div>`},
edit(id){
 const r=S.recipes.find(x=>x.id===id);if(!r)return hdr('编辑食谱')+'<div class=pg>食谱不存在</div>';DIRTY=false;WARN=false;
 const f=(k,l,v)=>`<h2>${l}</h2><input id=${k} value="${esc(v)}">`,ing=(r.ingredients||[]).map(i=>(i.name||i)+(i.amount?'｜'+i.amount:'')).join('\n');
 return hdr('编辑食谱')+`<div class=pg oninput="DIRTY=true;WARN=false">${f('e_n','名称',r.name)}${f('e_a','作者',r.author)}${f('e_s','来源',r.source)}${f('e_r','评分/评级',r.rating)}
 <h2>材料</h2><p class=m>每行一个，名称和用量用“｜”隔开，例如：鸡蛋｜3个</p><textarea id=e_i style="min-height:220px">${esc(ing)}</textarea>
 <h2>步骤</h2><p class=m>每行一步，不用写序号</p><textarea id=e_p style="min-height:260px">${esc((r.steps||[]).join('\n'))}</textarea>
 <h2>注意事项</h2><textarea id=e_t>${esc(txt(r.notes))}</textarea>
 <button class=btn onclick="saveEdit('${id}')">保存修改</button><p id=st class=m></p></div>`},
set(){
 return hdr('设置')+`<div class=pg><h2>AI 服务地址</h2><input id=wu value="${esc(WK())}" placeholder="https://prepo-ai.你的名字.workers.dev"><button class=btn onclick="localStorage.setItem(P+'workerUrl',$('#wu').value.trim());back();migrate()">保存</button><h2>备份</h2><button class="btn g" onclick="exp()">导出备份</button><input type=file accept=".json" onchange="imp(this.files[0])"><p class=m>导入只会覆盖有谱自己的数据。共 ${S.recipes.length} 个食谱。版本 ${VER}</p></div>`}
};
function openDr(){const ck=x=>x?'✓ ':'',c=(k,n)=>`<button class=row style="border-left-color:${k?catColor(k):'var(--y)'}" data-c="${esc(k)}" onclick="F.cat=this.dataset.c;F.made='';draw()">${ck(F.cat===k&&!F.made)}${esc(k||'全部')} <small>${n}</small></button>`,
 s=(k,t)=>`<button class=row onclick="F.sort='${k}';draw()">${ck(F.sort===k)}${t}</button>`;
 const L=filt(),ft=[F.cat||'全部',F.made&&(F.made==='1'?'已做过':'未做过'),F.q&&'搜索“'+F.q+'”'].filter(Boolean);
 $('#drc').innerHTML=`<p class=cur><b>当前：${esc(ft.join(' · '))}</b><br><span>${SORTN[F.sort]||SORTN.new} · 共 ${L.length} 个</span></p><h2>分类</h2>`+c('',S.recipes.length)+S.cats.map(k=>c(k,S.recipes.filter(r=>r.category===k).length)).join('')+`<h2>状态</h2><button class=row onclick="F.cat='';F.made='1';draw()">${ck(F.made==='1')}已做过</button><button class=row onclick="F.cat='';F.made='0';draw()">${ck(F.made==='0')}未做过</button><h2>排序</h2>`+s('new','抓取时间 · 新到旧')+s('old','抓取时间 · 旧到新')+s('name','名称');$('#dr').classList.add('on')}
$('#dr').onclick=e=>{if(e.target.id==='dr')$('#dr').classList.remove('on')};
/* 侧边栏打开时：上下划只滚侧边栏，滚到头或内容不够长时也不让手势传给下面的列表 */
(()=>{let y0=0;const dr=$('#dr');
 dr.addEventListener('touchstart',e=>{y0=e.touches[0].clientY},{passive:true});
 dr.addEventListener('touchmove',e=>{const c=$('#drc'),dy=e.touches[0].clientY-y0;
  if(!c.contains(e.target)||c.scrollHeight<=c.clientHeight+1||(c.scrollTop<=0&&dy>0)||(c.scrollTop+c.clientHeight>=c.scrollHeight-1&&dy<0))e.preventDefault()},{passive:false})})();
function saveEdit(id){
 const r=S.recipes.find(x=>x.id===id),v=s=>$(s).value.trim(),ls=s=>v(s).split('\n').map(x=>x.trim()).filter(Boolean);
 if(!v('#e_n'))return $('#st').textContent='名称不能为空';
 r.name=v('#e_n');r.author=v('#e_a');r.source=v('#e_s');r.rating=v('#e_r');
 r.ingredients=ls('#e_i').map(l=>{const m=l.split(/[｜|]/);return{name:m[0].trim(),amount:m.slice(1).join('｜').trim()}}).filter(i=>i.name);
 r.steps=ls('#e_p');r.notes=v('#e_t');delete r.bak;DIRTY=false;WARN=false;save();back()}
const mark=id=>{const r=S.recipes.find(x=>x.id===id);r.made=r.made?'':new Date().toLocaleDateString('zh-CN');save();draw(scrollY)};
const setCat=(id,c)=>{if(!c)return;if(!S.cats.includes(c))S.cats.push(c);const rr=S.recipes.find(x=>x.id===id);rr.category=c;rr.cv=2;save();back();draw(cur.y)};
async function api(path,b){const u=WK();if(!u)throw new Error('请先在设置里填写 AI 服务地址');const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),130000);let r,j;
 try{r=await fetch(u.replace(/\/$/,'')+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),signal:ac.signal});j=await r.json().catch(e=>{if(e.name==='AbortError')throw e;return{}})}
 catch(e){throw new Error(e.name==='AbortError'?'等待超过 130 秒，已中止，请稍后重试':'连不上 AI 服务（检查设置里的 Worker 地址，以及 Worker 的 ALLOW_ORIGIN）')}finally{clearTimeout(tm)}
 if(!r.ok)throw new Error(j.error||('服务返回错误 '+r.status));return j}
const shrink=f=>new Promise(ok=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8).split(',')[1])};i.onerror=()=>ok(null);i.src=URL.createObjectURL(f)});
function findDup(r){const n=norm(r.name),a=new Set((r.ingredients||[]).map(i=>norm(i.name||i)));for(const x of S.recipes){const m=norm(x.name),b=new Set((x.ingredients||[]).map(i=>norm(i.name||i)));let k=0;a.forEach(t=>b.has(t)&&k++);const j=k/Math.max(1,a.size+b.size-k);if(n&&m&&(m===n||((m.includes(n)||n.includes(m))&&j>.5)||j>.85))return x}}
const wait=m=>{const t0=Date.now(),f=()=>{const e=$('#st');if(e)e.textContent=m+'，已等待 '+Math.round((Date.now()-t0)/1000)+' 秒…'};f();const id=setInterval(f,1000);return()=>clearInterval(id)};
const busy=(on,m)=>{$('#go').disabled=on;$('#st').textContent=m||''};
const fcText=()=>FILES.length?`已选 ${FILES.length} 张，共 ${Math.ceil(FILES.length/10)} 批`:'还没有选择截图';
const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
const pack=async f=>{const a=await Promise.all(f.map(shrink));if(a.some(x=>!x))throw new Error('有图片无法读取（格式不支持？），请换成 PNG 或 JPG');return a};
const slim=r=>({name:r.name,author:r.author,source:r.source,rating:r.rating,ingredients:r.ingredients,steps:r.steps,notes:r.notes});
async function mergeInto(r,imgs){
 const j=await api('/merge',{recipe:slim(r),images:imgs}),n=j.recipe;
 if(!n)throw new Error('AI 没有返回合并结果');
 const sz=x=>(x.ingredients||[]).length+(x.steps||[]).length;
 if(sz(n)<sz(r)*0.8)throw new Error('合并结果比原来少了很多内容，已放弃这一批，原食谱没有改动');
 Object.assign(r,{name:n.name||r.name,author:r.author||n.author||'',source:r.source||n.source||'',rating:r.rating||n.rating||'',ingredients:n.ingredients||[],steps:n.steps||[],notes:txt(n.notes)||txt(r.notes)});
 await save()}
function undoMerge(id){const r=S.recipes.find(x=>x.id===id);if(!r||!r.bak)return;Object.assign(r,r.bak);delete r.bak;save();draw(scrollY)}
async function extract(id){
 if(!FILES.length)return busy(false,'请先选择截图');
 const bs=chunk(FILES,10),tot=bs.length;let stop=()=>{},r=id?S.recipes.find(x=>x.id===id):null,done=0,i=0;
 if(id&&!r)return busy(false,'这个食谱已经不存在');
 const snap=r?slim(r):null,added=[],dups=[];
 try{
  for(i=0;i<tot;i++){
   const tag=tot>1?`第 ${i+1}/${tot} 批 · `:'';
   busy(true,tag+'正在压缩图片…');const imgs=await pack(bs[i]);
   stop=wait(tag+'已上传 '+imgs.length+' 张，AI 正在'+(r?'合并':'识别'));
   if(r){await mergeInto(r,imgs);if(i===0&&snap){r.bak=snap;await save()}}
   else{
    const j=await api('/extract',{images:imgs,cats:newCats(),single:tot>1}),L=(j.recipes||[]).filter(x=>x&&x.name).slice(0,tot>1?1:99);
    if(!L.length)throw new Error('AI 没有识别出食谱');
    for(const x of L){const d=findDup(x);
     if(d){d.saves=(d.saves||1)+1;dups.push(d.id);continue}
     x.id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);x.saves=1;x.made='';x.created=Date.now();x.cv=2;x.category=(x.category||'未分类').trim();
     if(!S.cats.includes(x.category))S.cats.push(x.category);S.recipes.push(x);added.push(x.id);if(tot>1)r=x}
    await save();
    if(tot>1&&!r)break}
   stop();done++}
  FILES=[];
  if(id)back();else{cur={v:'result',a:{added,dups}};draw()}
 }catch(e){
  let m='失败：'+(tot>1?`第 ${i+1}/${tot} 批：`:'')+e.message;
  if(done>0&&r){
   if(id){FILES=bs.slice(done).flat();m+=`（前 ${done} 批已保存，再点上面的按钮可以从这一批继续）`;const fc=$('#fc');if(fc)fc.textContent=fcText()}
   else{FILES=[];m+=`（前 ${done} 批已保存成新食谱「${r.name}」，可以在食谱库里打开它，点“继续添加截图”补上剩下的）`}}
  busy(false,m)}finally{stop()}}
async function suggest(){
 const need=$('#need').value.trim();if(!need)return busy(false,'请先写下你的需求');
 if(!S.recipes.length)return busy(false,'食谱库还是空的');
 let stop=()=>{};
 try{busy(true,'正在发送…');stop=wait('AI 正在挑选');
  const lib=S.recipes.slice(0,400).map(r=>({id:r.id,name:r.name,category:r.category,ingredients:(r.ingredients||[]).map(i=>i.name||i),made:!!r.made,saves:r.saves||1})),
  j=await api('/suggest',{need,library:lib}),list=(j.suggestions||[]).map(s=>({r:S.recipes.find(r=>r.id===s.id),match:Math.max(0,Math.min(100,Math.round(s.match))),reason:s.reason})).filter(s=>s.r);
  if(!list.length)return busy(false,'库里没有合适的食谱，换个说法试试');
  const a=list.filter(s=>!s.r.made),b=list.filter(s=>s.r.made);SG={list:[...a,...b],i:0,madeN:b.length};go('sug')
 }catch(e){busy(false,'失败：'+e.message)}finally{stop()}}
/* 分类新规则（v0.1.10）：首次启动自动把没按新规则分过的食谱交给 AI 重分一次；每个食谱带 cv:2 标记，中途失败下次从没分的继续 */
const newCats=()=>[...new Set(S.recipes.filter(r=>r.cv===2&&r.category).map(r=>r.category))];
let MIG=false;
async function migrate(){
 if(MIG||S.catv===2)return;
 if(!S.recipes.length){S.catv=2;return save()}
 const todo=S.recipes.filter(r=>r.cv!==2);
 if(!todo.length){S.catv=2;return save()}
 if(!WK())return;
 MIG=true;const el=$('#mig'),say=(m,f)=>{el.textContent=m;el.style.display=m?'block':'none';el.dataset.f=f?'1':''};
 try{
  let n=0;
  for(const b of chunk(todo,30)){
   say(`正在按新规则重新分类食谱：${n}/${todo.length}（请先别关闭页面）`);
   const j=await api('/recat',{items:b.map(r=>({id:r.id,name:r.name,ingredients:(r.ingredients||[]).slice(0,12).map(i=>i.name||i)})),cats:newCats()});let k=0;
   for(const x of (j.items||[]).filter(Boolean)){const r=S.recipes.find(y=>y.id===x.id),c=String(x.category||'').trim().slice(0,12);
    if(r&&c){r.category=c;r.cv=2;if(!S.cats.includes(c))S.cats.push(c);k++}}
   if(!k)throw new Error('AI 没有返回分类结果');
   await save();n+=b.length}
  const left=S.recipes.filter(r=>r.cv!==2).length,used=new Set(S.recipes.map(r=>r.category));
  S.cats=S.cats.filter(c=>used.has(c));if(!left)S.catv=2;await save();
  say(left?`重新分类完成大部分，还有 ${left} 个没分好，下次打开会继续（点此关闭）`:`分类已更新：共 ${S.recipes.length} 个食谱，分为 ${S.cats.length} 类`,!!left);
  if(!left)setTimeout(()=>{if(!el.dataset.f)say('')},5000);
  if((cur.v==='home'||cur.v==='detail')&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!$('#dr').classList.contains('on'))draw(scrollY)
 }catch(e){say('重新分类没有完成：'+e.message+'（已完成的部分已保存，下次打开会继续；点此关闭）',true)}finally{MIG=false}}
async function exp(){const f=new File([JSON.stringify(S)],'prepo-backup.json',{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f]});
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
async function imp(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.recipes))throw 0;S={recipes:d.recipes,cats:d.cats||[],catv:d.catv};await save();stack=[];cur={v:'home'};draw();migrate()}catch(e){alert('备份文件不对')}}
/* 手势：右划返回，左右划切换 */
let tx,ty;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(e.target.closest('textarea,input'))return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6)return;
 if(V.swipe)V.swipe(dx>0?'R':'L',tx);else if(dx>0)back()},{passive:true});
(async()=>{try{S=(await kvGet('data'))||S}catch(e){document.body.innerHTML='<p style="padding:20px">本机存储暂时打不开，请重新打开 App。</p>';return}draw();migrate();
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
