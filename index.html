<style>

.cp{padding-bottom:calc(140px + env(safe-area-inset-bottom))}.row.sel{box-shadow:inset 0 0 0 2px var(--o)}.hc .mig{bottom:calc(140px + env(safe-area-inset-bottom))}
.seg.s{margin:6px 0}.seg.s button{min-height:36px;font-size:15px;border-width:1.5px}

.tb th,.tb td{border:1px solid rgba(128,128,128,.35);padding:8px 6px;text-align:center;vertical-align:middle;min-width:76px;line-height:1.35;background:var(--card)}

.cur{margin:0 0 6px;border:2px solid var(--o);border-radius:12px;padding:10px 14px;background:var(--card);font-size:18px;line-height:1.5}.cur b{color:var(--o)}.cur span{color:var(--mu);font-size:15px}

</style></head><body>
<div id="app"></div><div id="dr"><div id="drc"></div></div><div id=mig class=mig onclick="this.style.display='none'"></div>
<script>
const P='prepo:',DB='prepo_kv',VER='0.1.21';
const WK=()=>localStorage.getItem(P+'workerUrl')||'';
/* 存储层：只读写自己的 prepo_kv；以后要加 Firebase 同步，只需替换这两个函数 */
const idb=()=>new Promise((ok,no)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const kvGet=async k=>{const d=await idb();return new Promise(ok=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>ok(r.result)})};
const kvSet=async(k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})};
let S={recipes:[],cats:[]};const save=()=>{pruneCats();return kvSet('data',S)};
/* 分类维护：没有食谱的分类自动删掉；mine=用户自己建/整理的分类（AI 分类时优先选用）；fix=用户手动纠正过的例子；map=“AI 分的A→用户改成B”的规则 */
function pruneCats(){
 const used=new Set(S.recipes.map(r=>r.category).filter(Boolean));
 S.cats=[...S.cats.filter(c=>used.has(c)),...[...used].filter(c=>!S.cats.includes(c))];
 if(Array.isArray(S.mine))S.mine=S.mine.filter(c=>used.has(c));
 if(S.map)for(const k of Object.keys(S.map))if(!used.has(S.map[k])||used.has(k))delete S.map[k];
 if(Array.isArray(S.fix))S.fix=S.fix.filter(f=>used.has(f.to))}
function initCats(){
 if(!Array.isArray(S.mine))S.mine=[...new Set(S.recipes.filter(r=>r.cv===2&&r.category&&r.category!=='未分类').map(r=>r.category))];
 S.map=S.map||{};S.fix=S.fix||[];S.cmpHide=S.cmpHide||[];pruneCats()}
const fixCat=c=>{c=(c||'').trim();for(let i=0;i<3&&S.map&&S.map[c];i++)c=S.map[c];return c};
const catCtx=()=>({mine:S.mine||[],cats:newCats(),fixes:(S.fix||[]).map(f=>({name:f.name,ing:f.ing,from:f.from,to:f.to}))});
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const txt=v=>Array.isArray(v)?v.join('；'):(v||'');
const norm=s=>(s||'').toLowerCase().replace(/[\s\p{P}\p{S}]/gu,'');
/* 导航：从哪来回哪去，并还原滚动位置 */
let stack=[],cur={v:'home'},V={},F={cat:'',made:'',q:'',sort:'new'},ASK='',FILES=[],SG=null,DIRTY=false,WARN=false;
const go=(v,a)=>{cur.y=scrollY;stack.push(cur);cur={v,a};draw()};
const back=()=>{if(!stack.length)return;if(cur.v==='edit'&&DIRTY&&!WARN){WARN=true;const e=$('#st');if(e)e.textContent='有未保存的修改，再返回一次将放弃修改';return}DIRTY=false;WARN=false;cur=stack.pop();draw(cur.y)};
function draw(y){V={};document.body.classList.toggle('hn',cur.v==='home');document.body.classList.toggle('hc',cur.v==='cmp');const f=VIEWS[cur.v];$('#app').innerHTML=f(cur.a);window.scrollTo(0,y||0);$('#dr').classList.remove('on')}
const hdr=(t,l='‹',r='')=>`<div class="bar"><button onclick="back()">${l}</button><span>${t}</span>${r}</div>`;
const body=r=>`<h1>${esc(r.name)}</h1><p class=m>${[r.author&&'作者：'+r.author,r.source&&'来源：'+r.source,r.rating&&'评分：'+r.rating].filter(Boolean).map(esc).join('<br>')}</p><h2>材料</h2>${ingHtml(r)}<h2>步骤</h2><ol>${(r.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${r.notes?`<h2>注意事项</h2><p>${esc(txt(r.notes))}</p>`:''}`;
const SORTN={new:'按抓取时间·新到旧',old:'按抓取时间·旧到新',name:'按名称'};
const PAL=['#FF6B1A','#E5262B','#FFB300','#D6336C','#7048E8','#1C7ED6','#0CA678','#74B816'];
const catColor=c=>{const i=S.cats.indexOf(c);return i<0?'#9CA3AF':PAL[i%PAL.length]};
const rowOf=r=>`<button class=row style="border-left-color:${catColor(r.category)}" onclick="go('detail','${r.id}')">${esc(r.name)} ${r.made?'<span class=ok>✓已做过</span>':''}<small>${esc([r.category,r.author].filter(Boolean).join(' · '))}</small></button>`;
const filt=()=>{
 const L=S.recipes.filter(r=>(!F.cat||r.category===F.cat)&&(!F.made||(F.made==='1')===!!r.made)&&(!F.q||norm(r.name+(r.ingredients||[]).map(i=>i.name)).includes(norm(F.q))));
 const SO={new:(a,b)=>(b.created||0)-(a.created||0),old:(a,b)=>(a.created||0)-(b.created||0),name:(a,b)=>String(a.name).localeCompare(String(b.name),'zh')};L.sort(SO[F.sort]||SO.new);return L};
const NAV=`<div class=nav><button onclick="CMP=[];CQ='';go('cmp')"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>对比</button><button onclick="go('ask')"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>找食谱</button><button onclick="FILES=[];go('add')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>加食谱</button></div>`;
/* 食谱对比（v0.1.15）：CMP=已选食谱 id，CQ=搜索词，CR=最近一次对比报告；S.cmpHide=设置里隐藏的报告项 */
let CMP=[],CQ='',CR=null;
const CMPK=[['sum','总结'],['var','材料品种'],['in','材料比例'],['x','统一基准粉量对比'],['oth','其它参考比例']];
const cmpTog=id=>{const i=CMP.indexOf(id);if(i>=0)CMP.splice(i,1);else if(CMP.length>=3){const e=$('#st');if(e)e.textContent='最多选 3 个，请先取消一个';return}else CMP.push(id);draw(scrollY)};
const cmpHide=k=>{S.cmpHide=S.cmpHide||[];const i=S.cmpHide.indexOf(k);if(i>=0)S.cmpHide.splice(i,1);else S.cmpHide.push(k);save();draw(scrollY)};
let RC=null;
const ubase=()=>S.cmpBase>0?S.cmpBase:500,f1=x=>Math.round(x*10)/10;
const grpBody=(R,N,row)=>{const gs=GRPS.filter(g=>R.some(r=>r.grp===g[0]));return gs.map(g=>(gs.length>1?`<tr class=gt><td colspan=${N+1}>${g[1]}</td></tr>`:'')+R.filter(r=>r.grp===g[0]).map(row).join('')).join('')};
/* 统一基准粉量表：每款的粉类合计（只算面团组）都调成同一个基准粉量，再看各材料多少克（输入框改基准粉量时只重画这张表） */
function xtbHtml(){const{names,R,tot,base,multi}=RC,u=ubase(),N=names.length;
 return `<div class=tw><table class=tb><tr><th>对比项</th>${names.map(n=>`<th>${esc(n)}</th>`).join('')}</tr>${grpBody(R,N,r=>`<tr><td>${esc(r.name)}</td>${r.c.map((c,j)=>!c?'<td>—</td>':c.g===null?`<td>${esc(c.amt||'适量')}</td>`:base[j].g?`<td><b>${fmt(c.g*u/base[j].g)} g</b></td>`:'<td>—</td>').join('')}</tr>`)}<tr class=sum><td>${multi?'面团合计':'合计'}</td>${tot.map((t,j)=>`<td>${t&&base[j].g?fmt(t*u/base[j].g)+' g':'—'}</td>`).join('')}</tr></table></div>`}
function setBase(v){const n=parseFloat(v);if(!(n>0))return;S.cmpBase=n;save();const e=$('#xtb');if(e)e.innerHTML=xtbHtml()}
function repHtml(d,names){
 const H=S.cmpHide||[],sh=k=>!H.includes(k),A=x=>Array.isArray(x)?x:[],N=x=>typeof x==='number'&&isFinite(x)?x:null,e=esc,NN=names.length;
 const pick=(arr,n,j)=>{const a=A(arr);return a.find(x=>x&&x.recipe===n)||(a.length===names.length?a[j]:null)||null};
 const R=A(d.rows).filter(r=>r&&r.name).map(r=>({name:String(r.name),grp:gkey(r.group)||'dough',flour:!!r.flour,c:names.map((n,j)=>{const c=pick(r.cells,n,j);return c?{amt:String(c.amount||''),g:N(c.grams),est:!!c.est}:null})}));
 const D=R.filter(r=>r.grp==='dough'),DR=D.length?D:R,multi=new Set(R.map(r=>r.grp)).size>1,inTot=r=>DR===R||r.grp==='dough';
 const tot=names.map((_,j)=>DR.reduce((a,r)=>a+(r.c[j]&&r.c[j].g||0),0));
 const base=names.map((_,j)=>{let f=DR.reduce((a,r)=>a+(r.flour&&r.c[j]&&r.c[j].g||0),0),nm='粉类合计';
  if(!f){let m=null;DR.forEach(r=>{const g=r.c[j]&&r.c[j].g;if(g&&(!m||g>m.g))m={g,n:r.name}});if(m){f=m.g;nm=m.n}else nm=''}return{g:f,n:nm}});
 RC={names,R,tot,base,multi};
 const head=`<tr><th>对比项</th>${names.map(n=>`<th>${e(n)}</th>`).join('')}</tr>`,tw=b=>`<div class=tw><table class=tb>${head}${b}</table></div>`;
 let o=`<p class=m>对比：${names.map(e).join(' · ')}</p><p class=m>用量按常用换算估成克，带“≈”的是估算值，仅供参考。</p>`,n=0;
 const noRows='<p class=m>AI 没有返回材料表，请返回重新对比一次。</p>';
 if(sh('sum')&&d.summary){n++;o+=`<h2>总结</h2><p>${e(d.summary)}</p>`}
 if(sh('var')){n++;o+='<h2>材料品种</h2>';
  if(!R.length)o+=noRows;else{
   const cnt=r=>r.c.filter(Boolean).length,Sv=GRPS.flatMap(g=>R.filter(r=>r.grp===g[0]).map((r,i)=>[r,i]).sort((a,b)=>cnt(b[0])-cnt(a[0])||a[1]-b[1]).map(x=>x[0]));
   o+=tw(grpBody(Sv,NN,r=>`<tr><td>${e(r.name)}</td>${r.c.map(c=>`<td>${c?'<span class=yes>✓</span>':'<span class=no>✗</span>'}</td>`).join('')}</tr>`));
   const all=R.filter(r=>cnt(r)===names.length).length,only=names.map((nm,j)=>[nm,R.filter(r=>cnt(r)===1&&r.c[j]).length]).filter(x=>x[1]);
   o+=`<p class=m><span class=yes>✓</span> 有　<span class=no>✗</span> 没有。所有食谱都有的 ${all} 种${only.map(x=>`；仅「${e(x[0])}」有的 ${x[1]} 种`).join('')}。${multi?'同一种材料出现在不同组（如面团里的糖和糖水里的糖）算不同的项。':''}</p>`}}
 if(sh('in')){n++;o+='<h2>材料比例</h2>';
  if(!R.length)o+=noRows;else{
   const cell=(r,c,j)=>!c?'<td>—</td>':c.g===null?`<td>${e(c.amt||'适量')}</td>`:`<td><b>${c.est?'≈':''}${fmt(c.g)} g</b>${inTot(r)&&tot[j]?`<small>${f1(c.g/tot[j]*100)}%</small>`:''}${base[j].g?`<small class=rel>${f1(c.g/base[j].g*100)}%</small>`:''}</td>`;
   o+=tw(grpBody(R,NN,r=>`<tr><td>${e(r.name)}</td>${r.c.map((c,j)=>cell(r,c,j)).join('')}</tr>`)+`<tr class=sum><td>${multi?'面团合计':'合计'}</td>${tot.map(t=>`<td>${t?fmt(t)+' g':'—'}</td>`).join('')}</tr><tr class=sum><td>基准粉量</td>${base.map(b=>`<td>${b.g?fmt(b.g)+' g':'—'}${b.n&&b.n!=='粉类合计'?`<small>${e(b.n)}</small>`:''}</td>`).join('')}</tr>`);
   o+='<p class=m>每格三行：用量（克）｜占该款面团总重的 %（灰）｜相对基准粉量的 %（橙，面团里的粉类合计 = 100%）。'+(multi?'馅料、表面装饰、辅助液（烫煮糖水、碱水等）不并入面团的合计和灰色百分比，只显示相对面团基准粉量的橙色百分比。':'')+'“适量”等无法换算的不计入。没有粉类的食谱，以克数最大的材料为基准。</p>'}}
 if(sh('x')){n++;o+='<h2>统一基准粉量对比</h2>';

   const tag=tot>1?`第 ${i+1}/${tot} 批 · `:'';
   busy(true,tag+'正在压缩图片…');const imgs=await pack(bs[i]);
   stop=wait(tag+'已上传 '+imgs.length+' 张，AI 正在'+(r?'合并':'识别'));
   if(r){await mergeInto(r,imgs);if(i===0&&snap){r.bak=snap;await save()}}
   else{
    const j=await api('/extract',{images:imgs,...catCtx(),single:tot>1}),L=(j.recipes||[]).filter(x=>x&&x.name).slice(0,tot>1?1:99);
    if(!L.length)throw new Error('AI 没有识别出食谱');
    for(const x of L){x.ingredients=normIng(x.ingredients);const d=findDup(x);
     if(d){d.saves=(d.saves||1)+1;dups.push(d.id);continue}
     x.id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);x.saves=1;x.made='';x.created=Date.now();x.cv=2;x.category=fixCat(x.category)||'未分类';
     if(!S.cats.includes(x.category))S.cats.push(x.category);S.recipes.push(x);added.push(x.id);if(tot>1)r=x}
    await save();
    if(tot>1&&!r)break}
   stop();done++}
  FILES=[];
  if(id)back();else{cur={v:'result',a:{added,dups}};draw()}
 }catch(e){
  let m='失败：'+(tot>1?`第 ${i+1}/${tot} 批：`:'')+e.message;
  if(done>0&&r){
   if(id){FILES=bs.slice(done).flat();m+=`（前 ${done} 批已保存，再点上面的按钮可以从这一批继续）`;const fc=$('#fc');if(fc)fc.textContent=fcText()}
   else{FILES=[];m+=`（前 ${done} 批已保存成新食谱「${r.name}」，可以在食谱库里打开它，点“继续添加截图”补上剩下的）`}}
  busy(false,m)}finally{stop()}}
async function suggest(){
 const need=$('#need').value.trim();if(!need)return busy(false,'请先写下你的需求');
 if(!S.recipes.length)return busy(false,'食谱库还是空的');
 let stop=()=>{};
 try{busy(true,'正在发送…');stop=wait('AI 正在挑选');
  const lib=S.recipes.slice(0,400).map(r=>({id:r.id,name:r.name,category:r.category,ingredients:(r.ingredients||[]).map(i=>i.name||i),made:!!r.made,saves:r.saves||1})),
  j=await api('/suggest',{need,library:lib}),list=(j.suggestions||[]).map(s=>({r:S.recipes.find(r=>r.id===s.id),match:Math.max(0,Math.min(100,Math.round(s.match))),reason:s.reason})).filter(s=>s.r);
  if(!list.length)return busy(false,'库里没有合适的食谱，换个说法试试');
  const a=list.filter(s=>!s.r.made),b=list.filter(s=>s.r.made);SG={list:[...a,...b],i:0,madeN:b.length};go('sug')
 }catch(e){busy(false,'失败：'+e.message)}finally{stop()}}
/* 分类新规则（v0.1.10）：首次启动自动把没按新规则分过的食谱交给 AI 重分一次；每个食谱带 cv:2 标记，中途失败下次从没分的继续 */
const newCats=()=>[...new Set(S.recipes.filter(r=>r.cv===2&&r.category).map(r=>r.category))];
let MIG=false;
async function migrate(){
 if(MIG||S.catv===2)return;
 if(!S.recipes.length){S.catv=2;return save()}
 const todo=S.recipes.filter(r=>r.cv!==2);
 if(!todo.length){S.catv=2;return save()}
 if(!WK())return;
 MIG=true;const el=$('#mig'),say=(m,f)=>{el.textContent=m;el.style.display=m?'block':'none';el.dataset.f=f?'1':''};
 try{
  let n=0;
  for(const b of chunk(todo,30)){
   say(`正在按新规则重新分类食谱：${n}/${todo.length}（请先别关闭页面）`);
   const j=await api('/recat',{items:b.map(r=>({id:r.id,name:r.name,ingredients:(r.ingredients||[]).slice(0,12).map(i=>i.name||i)})),...catCtx()});let k=0;
   for(const x of (j.items||[]).filter(Boolean)){const r=S.recipes.find(y=>y.id===x.id),c=fixCat(String(x.category||'').trim().slice(0,12));
    if(r&&c){r.category=c;r.cv=2;if(!S.cats.includes(c))S.cats.push(c);k++}}
   if(!k)throw new Error('AI 没有返回分类结果');
   await save();n+=b.length}
  const left=S.recipes.filter(r=>r.cv!==2).length,used=new Set(S.recipes.map(r=>r.category));
  S.cats=S.cats.filter(c=>used.has(c));if(!left)S.catv=2;await save();
  say(left?`重新分类完成大部分，还有 ${left} 个没分好，下次打开会继续（点此关闭）`:`分类已更新：共 ${S.recipes.length} 个食谱，分为 ${S.cats.length} 类`,!!left);
  if(!left)setTimeout(()=>{if(!el.dataset.f)say('')},5000);
  if((cur.v==='home'||cur.v==='detail')&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!$('#dr').classList.contains('on'))draw(scrollY)
 }catch(e){say('重新分类没有完成：'+e.message+'（已完成的部分已保存，下次打开会继续；点此关闭）',true)}finally{MIG=false}}
async function exp(){const f=new File([JSON.stringify(S)],'prepo-backup.json',{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f]});
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
async function imp(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.recipes))throw 0;S={recipes:d.recipes,cats:d.cats||[],catv:d.catv,mine:d.mine,map:d.map,fix:d.fix,cmpHide:d.cmpHide,cmpBase:d.cmpBase};initCats();await save();stack=[];cur={v:'home'};draw();migrate()}catch(e){alert('备份文件不对')}}
/* 手势：右划返回，左右划切换 */
let tx,ty;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(e.target.closest('textarea,input'))return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6)return;
 if(V.swipe)V.swipe(dx>0?'R':'L',tx);else if(dx>0)back()},{passive:true});
(async()=>{try{S=(await kvGet('data'))||S}catch(e){document.body.innerHTML='<p style="padding:20px">本机存储暂时打不开，请重新打开 App。</p>';return}initCats();save();draw();migrate();
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
